name: Release

# Neue Version: Tag setzen, z. B. "v0.1.0". Dann wird eine signierte APK gebaut
# und als GitHub-Release veröffentlicht. Die App prüft später genau diese Releases auf Updates.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signierte APK veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Planer-Tests
        run: ./gradlew :core:test --no-daemon

      - name: Signierschlüssel bereitstellen
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then echo "Secret SIGNING_KEYSTORE_BASE64 fehlt"; exit 1; fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release-APK bauen
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:assembleRelease --no-daemon -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "schichtplaner-$VERSION.apk"

      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "schichtplaner-${GITHUB_REF_NAME#v}.apk" | grep -i "SHA-256"

      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "schichtplaner-${GITHUB_REF_NAME#v}.apk" \
            --title "Schichtplan ${GITHUB_REF_NAME#v}" \
            --generate-notes

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
